name: Deploy RGM public site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/validate-site.py'
      - 'scripts/test_validate_site.py'
      - 'publication-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test catalog policy
        run: python3 -B -m unittest scripts/test_validate_site.py

      - name: Validate public tree
        run: python3 scripts/validate-site.py site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
